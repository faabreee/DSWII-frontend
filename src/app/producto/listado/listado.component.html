<div style="display: flex; height: 100vh;">
    <app-nav></app-nav>

    <div class="container mt-4">
        <h1 class="text-center mb-4" >Listado de Productos</h1>
    
        <div class="mb-3 d-flex justify-content-between align-items-center">
            <button type="button"  class="btn btn-dark"(click)="registrarProducto()"> + Agregar</button>
            <div class="d-flex align-items-center">
                <input type="text" class="form-control me-2" [(ngModel)]="nomPro" placeholder="Buscar Producto"/>
                <button (click)="buscarProducto(nomPro)" class="btn btn-outline-primary">Buscar</button>
            </div>
        </div>
        <div>
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th class="text-center">ID</th>
                        <th class="text-center">Código</th>
                        <th class="text-center">Nombre</th>
                        <th class="text-center">Proveedor</th>
                        <th class="text-center">Precio</th>
                        <th class="text-center">Fecha Compra</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let producto of productos">
                        <td class="text-center">{{producto.id}}</td>
                        <td class="text-center">{{producto.codPro}}</td>
                        <td class="text-center">{{producto.nomPro}}</td>
                        <td class="text-center">{{producto?.objProveedor?.nomProvee}}</td>
                        <td class="text-center">{{producto.precio}}</td>
                        <td class="text-center">{{producto.fechaCompra | date:'dd/MM/yyyy'}}</td>
                        <td class="text-center">{{producto.stock}}</td>
                        <td class="text-center">
                            <button (click)="editarProducto(producto.id)" class="btn btn-success btn-sm me-2">Editar</button>
                            <!-- Botón de eliminar -->
                            <button type="button" class="btn btn-danger" (click)="eliminarProducto(producto.id)" class="btn btn-danger btn-sm">Eliminar</button>                    
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
