<div style="display: flex; height: 100vh;">
  <app-nav></app-nav>
  <div class="container mt-4">
      <h1 class="text-center mb-4">PROVEEDORES</h1>
    
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <button type="button" class="btn btn-dark"(click)="irRegistrarProveedor()"> + Agregar</button>
        <div class="d-flex align-items-center">
          <input type="text" class="form-control me-2" [(ngModel)]="name" placeholder="Buscar proveedor"/>
          <button (click)="buscarProveedor(name)" class="btn btn-outline-primary">Buscar</button>
        </div>
      </div>
    
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th class="text-center">ID</th>
            <th class="text-center">RUC</th>
            <th class="text-center">Proveedor</th>
            <th class="text-center">Correo</th>
            <th class="text-center">Teléfono</th>
            <th class="text-center">Dirección</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let proveedor of proveedores">
            <td class="text-center">{{proveedor.id}}</td>
            <td class="text-center">{{proveedor.ruc}}</td>
            <td class="text-center">{{proveedor.nomProvee}}</td>
            <td class="text-center">{{proveedor.email}}</td>
            <td class="text-center">{{proveedor.telefono}}</td>
            <td class="text-center">{{proveedor.direccion}}</td>
            <td class="text-center">
              <button (click)="irEditarProveedor(proveedor.id)" class="btn btn-success btn-sm me-2">Editar</button>
              <button type="button" class="btn btn-warning btn-sm me-2"(click)="irDetalle(proveedor.id)" >Detalles</button>
              <button (click)="eliminar(proveedor.id)" class="btn btn-danger btn-sm">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
  </div>
</div>
